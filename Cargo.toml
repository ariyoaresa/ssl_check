[package]
name = "sslcheck"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
description = "A terminal-based SSL/TLS certificate auditing tool"
authors = ["Ariyo Aresa"]
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
webpki-roots = "0.26"
x509-parser = "0.16"
clap = { version = "4", features = ["derive"] }
colored = "2"
comfy-table = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-rustls = "0.26"
dirs = "6"

[profile.release]
lto = true
opt-level = "z"
strip = true
